name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una ejecucion por rama: un push nuevo cancela el anterior en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back_MCLog

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mclog
        # Se publica en el 5435 para que coincida con el DATABASE_URL que ya
        # trae el script de test y no haya que duplicarlo aqui.
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5435/mclog?schema=public
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ChangeMe123!
      API_KEY: dev-key
      JWT_ACCESS_SECRET: dev-access-secret
      JWT_REFRESH_SECRET: dev-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Back_MCLog/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Comprobacion de tipos
        run: npx tsc --noEmit
      - name: Compilacion
        run: npm run build
      - name: Tests
        run: npm test

  lib:
    name: Libreria npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back_MCLog/log-service-lib

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Back_MCLog/log-service-lib/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_mclog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_mclog/package-lock.json

      - run: npm ci
      - name: Comprobacion de tipos
        run: npx tsc --noEmit
      - name: Compilacion
        run: npm run build
